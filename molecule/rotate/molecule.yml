---
# Key rotation: converge with generated keys, rotate once in side_effect,
# then check the table moved to the new key.
dependency:
  name: galaxy
  enabled: false
driver:
  name: podman
# Names end in TEST_RUN_ID, which scripts/test.sh sets per checkout, so
# several checkouts can run the same scenario at once.
platforms:
  - name: mariadb-rotate-el10-${TEST_RUN_ID:-local}
    image: docker.io/almalinux/10-init
    pre_build_image: true
    command: /sbin/init
    systemd: always
    privileged: true
    rootless: true
provisioner:
  name: ansible
  playbooks:
    prepare: ../default/prepare.yml
    converge: ../default/converge.yml
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
