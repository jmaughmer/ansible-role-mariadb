---
# Key rotation: converge with generated keys, rotate once in side_effect,
# then check the table moved to the new key.
dependency:
  name: galaxy
  enabled: false
driver:
  name: podman
platforms:
  - name: mariadb-rotate-el10
    image: docker.io/almalinux/10-init
    pre_build_image: true
    command: /sbin/init
    systemd: always
    privileged: true
    rootless: true
provisioner:
  name: ansible
  playbooks:
    prepare: ../default/prepare.yml
    converge: ../default/converge.yml
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
