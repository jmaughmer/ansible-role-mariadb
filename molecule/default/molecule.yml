---
# Collections are installed by scripts/test.sh, pinned per ansible-core.
dependency:
  name: galaxy
  enabled: false
driver:
  name: podman
platforms:
  - name: mariadb-el9
    image: docker.io/almalinux/9-init
    pre_build_image: true
    command: /sbin/init
    systemd: always
    privileged: true
    rootless: true
  - name: mariadb-el10
    image: docker.io/almalinux/10-init
    pre_build_image: true
    command: /sbin/init
    systemd: always
    privileged: true
    rootless: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
