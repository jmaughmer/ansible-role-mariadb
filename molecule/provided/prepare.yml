---
- name: Prepare
  hosts: all
  tasks:
    - name: Install openssl for the checks in verify.yml
      ansible.builtin.dnf:
        name: openssl
        state: present

    # /etc/hosts is a bind mount in podman, so it cannot be replaced atomically.
    - name: Resolve the name on the first test certificate
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: 127.0.0.1 default.example.test
        unsafe_writes: true
