---
- name: Create MariaDB directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: mysql
    group: mysql
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ mariadb_datadir }}", mode: "{{ mariadb_datadir_mode }}" }
    - { path: "{{ mariadb_log_dir }}", mode: "{{ mariadb_log_dir_mode }}" }
    - { path: "{{ mariadb_secure_file_priv }}", mode: "0750" }
  loop_control:
    label: "{{ item.path }}"
  when: item.path | length > 0

# On EL9 and later the packaged tmpfiles.d entry resets /var/lib/mysql to 0755
# whenever systemd-tmpfiles runs, which package installs trigger. For the same
# path the entry in the earliest file name wins, so this one keeps the mode.
- name: Keep the data directory mode across systemd-tmpfiles runs
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/00-mariadb-datadir.conf
    content: "d {{ mariadb_datadir }} {{ mariadb_datadir_mode }} mysql mysql -\n"
    owner: root
    group: root
    mode: "0644"
  when: mariadb_datadir | length > 0

- name: Write the MariaDB server configuration
  ansible.builtin.template:
    src: mariadb.cnf.j2
    dest: "{{ mariadb_config_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart mariadb
